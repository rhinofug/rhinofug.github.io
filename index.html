<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F. Utku Gercik | Links</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111111;
            --text-color: #ffffff;
            --btn-bg: #222222;
            --btn-hover: #333333;
            --accent: #00ffcc;
            --coffee-color: #FFDD00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid var(--accent);
            padding: 3px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 15px;
            color: #aaaaaa;
            margin-bottom: 30px;
            line-height: 1.5;
            font-style: italic;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #333;
            position: relative;
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }

        /* Special Highlighting */
        .btn-vcut {
            border-color: var(--accent);
            background-color: rgba(0, 255, 204, 0.05);
        }
        
        .btn-coffee {
            border-color: var(--coffee-color);
            background-color: rgba(255, 221, 0, 0.05);
            color: var(--coffee-color);
        }
        .btn-coffee i {
            color: var(--coffee-color);
        }
        .btn-coffee:hover {
            border-color: var(--coffee-color);
            box-shadow: 0 4px 15px rgba(255, 221, 0, 0.15);
            background-color: rgba(255, 221, 0, 0.1);
        }

        .social-icons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 24px;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--accent);
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 12px;
            color: #666;
        }

    </style>
</head>
<body>

    <div class="container">
        <img src="https://avatars.githubusercontent.com/u/rhinofug?v=4" alt="F. Utku Gercik" class="profile-pic" onerror="this.src='https://ui-avatars.com/api/?name=Utku+Gercik&background=random&color=fff&size=150'">
        
        <h1>F. Utku Gercik</h1>
        <p class="bio">"From Diodes to Human Experience: An Audio Enthusiast."</p>

        <div class="links-container">
            <!-- VCut2DAW -->
            <a href="https://github.com/rhinofug/VCut2DAW" target="_blank" class="link-btn btn-vcut">
                <i class="fa-solid fa-scissors"></i>
                Download VCut2DAW
            </a>

            <!-- Buy Me A Coffee -->
            <a href="https://buymeacoffee.com/rhinofug" target="_blank" class="link-btn btn-coffee">
                <i class="fa-solid fa-mug-hot"></i>
                Buy Me A Coffee
            </a>
        </div>

        <div class="social-icons">
            <a href="https://www.imdb.com/name/nm8925449/" target="_blank" title="IMDb"><i class="fa-brands fa-imdb" style="color: #f5c518;"></i></a>
            <a href="https://tr.linkedin.com/in/furkan-utku-ger%C3%A7ik-98b5ba128" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            <a href="https://www.instagram.com/fugworks/" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://github.com/rhinofug" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="mailto:utkugercik@gmail.com" title="Email Me"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </div>

    <footer>
        &copy; 2026 F. Utku Gercik
    </footer>

</body>
</html>
