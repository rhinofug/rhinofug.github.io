<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furkan Utku Gerçik | Links</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111111;
            --text-color: #ffffff;
            --btn-bg: #222222;
            --btn-hover: #333333;
            --accent: #00ffcc;
            --coffee-color: #FFDD00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid var(--accent);
            padding: 3px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 15px;
            color: #aaaaaa;
            margin-bottom: 30px;
            line-height: 1.5;
            font-style: italic;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #333;
            position: relative;
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.1);
        }

        /* Special Highlighting */
        .btn-vcut {
            border-color: var(--accent);
            background-color: rgba(0, 255, 204, 0.05);
        }
        
        .btn-coffee {
            border-color: var(--coffee-color);
            background-color: rgba(255, 221, 0, 0.05);
            color: var(--coffee-color);
        }
        .btn-coffee i {
            color: var(--coffee-color);
        }
        .btn-coffee:hover {
            border-color: var(--coffee-color);
            box-shadow: 0 4px 15px rgba(255, 221, 0, 0.15);
            background-color: rgba(255, 221, 0, 0.1);
        }

        .social-icons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-icons a {
            font-size: 32px;
            transition: all 0.3s ease;
            text-decoration: none;
            cursor: pointer;
        }

        .social-icons a:hover {
            transform: scale(1.15);
        }

        /* Brand Colors */
        .icon-imdb { color: #f5c518; }
        .icon-linkedin { color: #0a66c2; }
        .icon-instagram { color: #E1306C; }
        .icon-github { color: #ffffff; }
        .icon-email { color: #ea4335; }
        .icon-email.success { color: #00ffcc !important; }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--accent);
            color: #000;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 12px;
            color: #666;
        }

    </style>
</head>
<body>

    <div class="container">
        <img src="profile.jpg" alt="Furkan Utku Gerçik" class="profile-pic">
        
        <h1>Furkan Utku Gerçik</h1>
        <p class="bio">"From Diodes to Human Experience: An Audio Enthusiast."<br><span style="font-size: 13px; color: #888; font-style: normal; margin-top: 5px; display: inline-block;"><i class="fa-solid fa-location-dot"></i> Istanbul, Turkey <img src="https://flagcdn.com/w20/tr.png" alt="TR" style="vertical-align: text-bottom; width: 18px; display: inline-block;"></span></p>

        <div class="links-container">
            <!-- VCut2DAW -->
            <a href="https://github.com/rhinofug/VCut2DAW" target="_blank" class="link-btn btn-vcut">
                <i class="fa-solid fa-scissors"></i>
                Download VCut2DAW
            </a>

            <!-- Buy Me A Coffee -->
            <a href="https://buymeacoffee.com/rhinofug" target="_blank" class="link-btn btn-coffee">
                <i class="fa-solid fa-mug-hot"></i>
                Buy Me A Coffee
            </a>
        </div>

        <div class="social-icons">
            <a href="https://www.imdb.com/name/nm8925449/" target="_blank" class="icon-imdb" title="IMDb"><i class="fa-brands fa-imdb"></i></a>
            <a href="https://tr.linkedin.com/in/furkan-utku-ger%C3%A7ik-98b5ba128" target="_blank" class="icon-linkedin" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            <a href="https://www.instagram.com/fugworks/" target="_blank" class="icon-instagram" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://github.com/rhinofug" target="_blank" class="icon-github" title="GitHub"><i class="fa-brands fa-github"></i></a>
            <a onclick="copyEmail()" class="icon-email" id="email-btn" title="Copy Email"><i id="email-icon" class="fa-solid fa-envelope"></i></a>
        </div>
    </div>

    <!-- Toast Element -->
    <div id="toast"><i class="fa-solid fa-check"></i> Email Copied to Clipboard!</div>

    <footer>
        &copy; 2026 Furkan Utku Gerçik<br><br><span style="font-size: 14px;"><img src="https://flagcdn.com/w20/tr.png" alt="TR" style="vertical-align: text-bottom; width: 18px; display: inline-block;"> utkugercik@gmail.com</span>
    </footer>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("utkugercik@gmail.com").then(() => {
                const toast = document.getElementById("toast");
                const icon = document.getElementById("email-icon");
                const btn = document.getElementById("email-btn");
                
                // Show toast
                toast.className = "show";
                
                // Change button style to success
                icon.className = "fa-solid fa-check";
                btn.classList.add("success");
                
                setTimeout(() => {
                    toast.className = toast.className.replace("show", "");
                    icon.className = "fa-solid fa-envelope";
                    btn.classList.remove("success");
                }, 2500);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }
    </script>
</body>
</html>
